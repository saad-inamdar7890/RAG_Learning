name: RAG Pipeline CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start FastAPI Backend
      run: |
        uvicorn src.api:app --host 0.0.0.0 --port 8000 &
        sleep 5  # Give the server a few seconds to start

    - name: Run LLM-as-a-judge Evaluation
      # Note: In a real CI, you would point the Ollama URL to a cloud LLM endpoint 
      # or run a small model inside a docker service. For this portfolio, the code 
      # proves the CI-gating logic is structurally sound.
      run: |
        python scripts/test_eval.py
